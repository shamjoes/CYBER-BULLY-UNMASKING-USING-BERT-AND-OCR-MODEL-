<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Unmaking Cyberbullies</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #4a00e0 0%, #8e2de2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        /* Animated background */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.1"><circle cx="50" cy="50" r="40" fill="none" stroke="white" stroke-width="2"/><path d="M20 50 L80 50 M50 20 L50 80" stroke="white" stroke-width="2"/></svg>') repeat;
            animation: rotate 60s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .admin-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        h1::before {
            content: '👑';
            font-size: 1.2em;
        }
        .admin-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.5);
            transform: translateY(0);
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: white;
        }
        .input-group input:focus {
            outline: none;
            border-color: #8e2de2;
            box-shadow: 0 0 0 4px rgba(142, 45, 226, 0.1);
        }
        .admin-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4a00e0, #8e2de2);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 20px 0;
        }
        .admin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(74, 0, 224, 0.4);
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #8e2de2;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
            padding: 5px 10px;
            border-radius: 10px;
        }
        .back-link a:hover {
            color: #4a00e0;
            background: rgba(142, 45, 226, 0.1);
        }
        .divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, #8e2de2, transparent);
            margin: 20px 0;
        }
        /* Search: "admin login form design" */
        /* Search: "secure admin authentication interface" */
        /* Search: "gradient admin panel login" */
    </style>
</head>
<body>

<div class="admin-container">
    <h1>Admin Login</h1>

    <div class="admin-card">
        <form method="POST" action="/admin/login">
            <div class="input-group">
                <!-- Search: "admin username input design" -->
                <input type="text" name="username" placeholder="Admin Username" required>
            </div>
            
            <div class="input-group">
                <!-- Search: "admin password input modern" -->
                <input type="password" name="password" placeholder="Admin Password" required>
            </div>

            <button type="submit" class="admin-btn">🔒 Login as Admin</button>

            <div class="divider"></div>

            <div class="back-link">
                <a href="/admin_key.html">← Back to Key Entry</a>
            </div>
        </form>
    </div>
</div>

{% if message %}
<script>
    alert("{{ message }}");
</script>
{% endif %}

</body>
</html>
